<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grow Link Sharing</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            line-height: 1.6;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            background: white;
            border-bottom: 1px solid #e5e5e5;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0066FF;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
        }

        button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #0066FF;
            color: white;
        }

        .btn-primary:hover {
            background: #0052cc;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            color: #0066FF;
            border: 2px solid #0066FF;
        }

        .btn-secondary:hover {
            background: #f0f7ff;
        }

        /* Hero Section */
        .hero {
            position: relative;
            padding: 4rem 2rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            align-items: center;
            overflow: hidden;
        }

        .hero-content {
            z-index: 10;
        }

        .hero h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 1rem;
            color: #1a1a1a;
        }

        .hero p {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 2rem;
        }

        .hero-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .hero-bg {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            font-family: 'Montserrat', sans-serif;
            font-size: 12rem;
            font-weight: 900;
            color: rgba(0, 102, 255, 0.08);
            white-space: nowrap;
            z-index: 1;
            line-height: 1;
        }

        .animals {
            position: absolute;
            right: 5%;
            top: 50%;
            transform: translateY(-50%);
            font-size: 8rem;
            z-index: 2;
            opacity: 0.6;
        }

        /* Links Section */
        .links-section {
            padding: 3rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .links-section h2 {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: #1a1a1a;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .link-card {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        .link-card:hover {
            border-color: #0066FF;
            box-shadow: 0 4px 12px rgba(0, 102, 255, 0.1);
            transform: translateY(-4px);
        }

        .link-card h3 {
            font-size: 1rem;
            margin-bottom: 0.5rem;
            color: #1a1a1a;
        }

        .link-card p {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 1rem;
        }

        .link-card a {
            color: #0066FF;
            text-decoration: none;
            word-break: break-all;
            font-size: 0.85rem;
        }

        .link-card a:hover {
            text-decoration: underline;
        }

        .link-time {
            font-size: 0.8rem;
            color: #999;
            margin-top: 1rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
        }

        .modal-content h2 {
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: #0066FF;
            box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.1);
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        .btn-cancel {
            background: #f0f0f0;
            color: #1a1a1a;
        }

        .btn-cancel:hover {
            background: #e0e0e0;
        }

        /* Private Links Page */
        .private-page {
            display: none;
            padding: 2rem;
            max-width: 500px;
            margin: 2rem auto;
        }

        .private-page.active {
            display: block;
        }

        .private-form {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 2rem;
        }

        .private-form h2 {
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .lock-icon {
            font-size: 1.5rem;
        }

        .private-result {
            background: #f0f7ff;
            border: 1px solid #0066FF;
            border-radius: 12px;
            padding: 1.5rem;
            margin-top: 1.5rem;
            display: none;
        }

        .private-result.active {
            display: block;
        }

        .private-result h3 {
            margin-bottom: 1rem;
            color: #0066FF;
        }

        .private-link {
            background: white;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .private-link a {
            color: #0066FF;
            text-decoration: none;
            word-break: break-all;
            flex: 1;
        }

        .private-link a:hover {
            text-decoration: underline;
        }

        .copy-btn {
            background: #0066FF;
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-left: 1rem;
            white-space: nowrap;
        }

        .copy-btn:hover {
            background: #0052cc;
        }

        .logout-btn {
            background: #f0f0f0;
            color: #1a1a1a;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 1rem;
            width: 100%;
        }

        .logout-btn:hover {
            background: #e0e0e0;
        }

        .error-msg {
            color: #dc2626;
            margin-top: 1rem;
            padding: 1rem;
            background: #fee2e2;
            border-radius: 8px;
            display: none;
        }

        .error-msg.active {
            display: block;
        }

        @media (max-width: 768px) {
            .hero {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 2rem;
            }

            .hero-bg {
                font-size: 6rem;
            }

            .animals {
                font-size: 4rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo">Grow</div>
        <div class="nav-buttons">
            <button class="btn-secondary" onclick="showHome()">Home</button>
            <button class="btn-primary" onclick="openAddLinkModal()">Add Link</button>
            <button class="btn-secondary" onclick="showPrivateLinks()">Private Links</button>
        </div>
    </header>

    <!-- Home Page -->
    <div id="home-page" class="active">
        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-content">
                <h1>Share Your Links</h1>
                <p>Easily share and manage your favorite links with the world. Add, organize, and access them anytime, anywhere.</p>
                <div class="hero-buttons">
                    <button class="btn-primary" onclick="openAddLinkModal()">Add Your First Link</button>
                    <button class="btn-secondary" onclick="showPrivateLinks()">Private Links</button>
                </div>
            </div>
            <div class="hero-bg">FaXtifar</div>
            <div class="animals">🦁🐯</div>
        </section>

        <!-- Links Section -->
        <section class="links-section">
            <h2>Recent Links</h2>
            <div class="links-grid" id="links-grid">
                <!-- Links will be added here -->
            </div>
        </section>
    </div>

    <!-- Private Links Page -->
    <div id="private-page" class="private-page">
        <div class="private-form">
            <h2><span class="lock-icon">🔐</span> Private Links</h2>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password">
            </div>
            <button class="btn-primary" onclick="verifyPrivateAccess()" style="width: 100%;">Access Private Links</button>
            <div class="error-msg" id="error-msg"></div>

            <div class="private-result" id="private-result">
                <h3>Your Private Links</h3>
                <div id="private-links-container"></div>
                <button class="logout-btn" onclick="logoutPrivate()">Logout</button>
            </div>
        </div>
    </div>

    <!-- Add Link Modal -->
    <div class="modal" id="add-link-modal">
        <div class="modal-content">
            <h2>Add New Link</h2>
            <div class="form-group">
                <label>URL</label>
                <input type="url" id="link-url" placeholder="https://example.com">
            </div>
            <div class="form-group">
                <label>Description (optional)</label>
                <input type="text" id="link-desc" placeholder="What is this link about?">
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeAddLinkModal()">Cancel</button>
                <button class="btn-primary" onclick="addLink()">Add Link</button>
            </div>
        </div>
    </div>

    <script>
        // Data storage
        const accounts = [
            { username: 'Medina', password: '2013', url: 'https://canva.link/1nug8drnudjxbjb' },
            { username: 'Faxtifar', password: '2013', url: 'https://canva.link/a08hv9gue14h4lf' },
            { username: 'English', password: 'link', url: 'https://files.manuscdn.com/user_upload_by_module/session_file/310519663374795798/wROvpcJAsrKGYoAu.jpeg' }
        ];

        let links = JSON.parse(localStorage.getItem('links')) || [];
        let currentPrivateUser = null;

        // Initialize
        function init() {
            renderLinks();
        }

        // Show Home
        function showHome() {
            document.getElementById('home-page').style.display = 'block';
            document.getElementById('private-page').classList.remove('active');
            renderLinks();
        }

        // Show Private Links
        function showPrivateLinks() {
            document.getElementById('home-page').style.display = 'none';
            document.getElementById('private-page').classList.add('active');
            document.getElementById('private-result').classList.remove('active');
            document.getElementById('error-msg').classList.remove('active');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        // Verify Private Access
        function verifyPrivateAccess() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            const account = accounts.find(a => a.username === username && a.password === password);

            if (account) {
                currentPrivateUser = account;
                errorMsg.classList.remove('active');
                document.getElementById('private-result').classList.add('active');
                renderPrivateLink(account);
            } else {
                errorMsg.textContent = 'Invalid username or password';
                errorMsg.classList.add('active');
            }
        }

        // Render Private Link
        function renderPrivateLink(account) {
            const container = document.getElementById('private-links-container');
            container.innerHTML = `
                <div class="private-link">
                    <a href="${account.url}" target="_blank">${account.url}</a>
                    <button class="copy-btn" onclick="copyToClipboard('${account.url}')">Copy</button>
                </div>
            `;
        }

        // Logout Private
        function logoutPrivate() {
            currentPrivateUser = null;
            document.getElementById('private-result').classList.remove('active');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        // Copy to Clipboard
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Link copied to clipboard!');
            });
        }

        // Open Add Link Modal
        function openAddLinkModal() {
            document.getElementById('add-link-modal').classList.add('active');
        }

        // Close Add Link Modal
        function closeAddLinkModal() {
            document.getElementById('add-link-modal').classList.remove('active');
            document.getElementById('link-url').value = '';
            document.getElementById('link-desc').value = '';
        }

        // Add Link
        function addLink() {
            const url = document.getElementById('link-url').value;
            const desc = document.getElementById('link-desc').value;

            if (!url) {
                alert('Please enter a URL');
                return;
            }

            const link = {
                id: Date.now(),
                url: url,
                description: desc || 'No description',
                createdAt: new Date()
            };

            links.unshift(link);
            localStorage.setItem('links', JSON.stringify(links));
            closeAddLinkModal();
            renderLinks();
        }

        // Render Links
        function renderLinks() {
            const grid = document.getElementById('links-grid');
            if (links.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #999;">No links yet. Add your first link!</p>';
                return;
            }

            grid.innerHTML = links.map(link => `
                <div class="link-card">
                    <h3>${link.description}</h3>
                    <a href="${link.url}" target="_blank">${link.url}</a>
                    <div class="link-time">${formatTime(link.createdAt)}</div>
                </div>
            `).join('');
        }

        // Format Time
        function formatTime(date) {
            const d = new Date(date);
            const now = new Date();
            const diff = now - d;
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);

            if (minutes < 1) return 'just now';
            if (minutes < 60) return `${minutes}m ago`;
            if (hours < 24) return `${hours}h ago`;
            if (days < 7) return `${days}d ago`;
            return d.toLocaleDateString();
        }

        // Initialize on load
        window.addEventListener('load', init);

        // Close modal when clicking outside
        document.getElementById('add-link-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeAddLinkModal();
            }
        });
    </script>
</body>
</html>
